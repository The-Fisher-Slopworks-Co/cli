version: 2

updates:
  # Security updates only: a limit of 0 turns off version updates, while
  # Dependabot still opens PRs for vulnerable modules (needs "Dependabot
  # security updates" on in the repository settings).
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore(deps)
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(deps)
    groups:
      actions:
        update-types: [minor, patch]
